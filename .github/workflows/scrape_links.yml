name: Process Ad Links High Speed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape Shard ${{ matrix.shard }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]  # 6 Parallel Workers
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install playwright pandas numpy aiohttp
          playwright install --with-deps chromium

      - name: Run Scraper Shard
        env:
          TOTAL_SHARDS: 6                  # Matches Python env key and matrix length
          SHARD_INDEX: ${{ matrix.shard }} # Passes 0, 1, 2, 3, 4, 5
          PYTHONUNBUFFERED: "1"
        run: python process_links.py

      - name: Upload Shard Artifact
        # 'always()' ensures you can view screenshots even if you stop/cancel the run early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ads-data-${{ matrix.shard }}
          path: data/
          retention-days: 1

  commit_results:
    name: Merge and Push to Repo
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp_data/
          pattern: ads-data-*
          merge-multiple: true

      - name: Merge Folders
        run: |
          mkdir -p data
          cp -rn temp_data/* data/ || true

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Processor-Bot"
          git config --global user.email "actions@github.com"
          git add data/
          if [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "Sync: Combined Ad Images $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new images found."
          fi
