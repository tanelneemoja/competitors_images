name: Process Ad Links High Speed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================================
  # SCRAPE
  # ==========================================================

  scrape:
    name: Scrape Shard ${{ matrix.shard }}

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false

      matrix:
        shard: [0, 1, 2, 3, 4, 5]  # 6 Parallel Workers

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install Dependencies
        run: |
          pip install playwright pandas numpy aiohttp
          playwright install --with-deps chromium

      # ------------------------------------------------------
      # RUN SCRAPER
      # ------------------------------------------------------

      - name: Run Scraper Shard
        env:
          TOTAL_SHARDS: 6
          SHARD_INDEX: ${{ matrix.shard }}

          # IMPORTANT:
          # Same version for every shard in this GitHub run.
          # Used by process_links.py for ?v= cache busting.
          RUN_VERSION: ${{ github.run_id }}

          PYTHONUNBUFFERED: "1"

        run: |
          echo "=============================================="
          echo "🚀 Starting scraper"
          echo "=============================================="
          echo "Shard:       ${{ matrix.shard }}"
          echo "Total shards: 6"
          echo "Run ID:      ${{ github.run_id }}"
          echo "=============================================="

          python process_links.py

      # ------------------------------------------------------
      # SHOW SHARD OUTPUT
      # ------------------------------------------------------

      - name: Show Shard Results
        if: always()
        run: |
          echo "=============================================="
          echo "📊 SHARD RESULTS"
          echo "=============================================="

          echo ""
          echo "Images:"
          if [ -d "data" ]; then
            find data -type f | sort | head -100
            echo ""
            echo "Total images:"
            find data -type f | wc -l
          else
            echo "No data directory."
          fi

          echo ""
          echo "CSV:"
          if [ -f "results.csv" ]; then
            wc -l results.csv
            echo ""
            head -10 results.csv
          else
            echo "No results.csv found."
          fi

      # ------------------------------------------------------
      # UPLOAD SHARD ARTIFACTS
      # ------------------------------------------------------

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: ads-data-${{ matrix.shard }}

          path: |
            data/
            results.csv

          retention-days: 1


  # ==========================================================
  # MERGE
  # ==========================================================

  commit_results:

    name: Merge and Push to Repo

    needs: scrape

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.10'

      # ------------------------------------------------------
      # DOWNLOAD ALL SHARD ARTIFACTS
      # ------------------------------------------------------

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

        with:
          path: temp_artifacts/
          pattern: ads-data-*

      # ------------------------------------------------------
      # MERGE
      # ------------------------------------------------------

      - name: Merge Folders and Combine CSVs

        run: |

          pip install pandas

          echo "=============================================="
          echo "📦 DOWNLOADED ARTIFACTS"
          echo "=============================================="

          find temp_artifacts -type f | sort | head -100

          echo ""
          echo "=============================================="
          echo "🧹 CLEANING OLD REPOSITORY DATA"
          echo "=============================================="

          # IMPORTANT:
          #
          # The checkout contains the previous run's:
          #
          #   data/
          #   results.csv
          #
          # We MUST delete both before restoring the
          # artifacts from this run.
          #
          # Otherwise old images and old CSV rows survive.

          rm -rf data
          rm -f results.csv

          mkdir -p data

          echo "✅ Old data/ removed."
          echo "✅ Old results.csv removed."

          echo ""
          echo "=============================================="
          echo "🖼️ RESTORING CURRENT RUN IMAGES"
          echo "=============================================="

          # Copy every shard's data folder into the
          # completely empty repository data folder.

          for shard_data in temp_artifacts/ads-data-*/data; do

            if [ -d "$shard_data" ]; then

              echo "Copying:"
              echo "  $shard_data"

              cp -rf "$shard_data"/. data/

            else

              echo "⚠️ No data folder found:"
              echo "  $shard_data"

            fi

          done

          echo ""
          echo "=============================================="
          echo "📊 COMBINING CURRENT RUN CSV FILES"
          echo "=============================================="

          python -c "

          import os
          import glob
          import pandas as pd

          # --------------------------------------------------
          # Find ONLY CSV files produced by this run
          # --------------------------------------------------

          csv_files = glob.glob(
              'temp_artifacts/**/results.csv',
              recursive=True
          )

          print(
              f'Found {len(csv_files)} shard CSV files.'
          )

          for f in csv_files:

              print(
                  f'  - {f} '
                  f'({os.path.getsize(f)} bytes)'
              )

          # --------------------------------------------------
          # Load CSVs
          # --------------------------------------------------

          dfs = []

          for f in csv_files:

              if (
                  os.path.exists(f)
                  and os.path.getsize(f) > 0
              ):

                  try:

                      df = pd.read_csv(f)

                      if not df.empty:

                          dfs.append(df)

                          print(
                              f'  ✅ Loaded '
                              f'{len(df)} rows from {f}'
                          )

                      else:

                          print(
                              f'  ⚠️ Empty CSV: {f}'
                          )

                  except Exception as e:

                      print(
                          f'  ❌ Failed to read '
                          f'{f}: {e}'
                      )

          # --------------------------------------------------
          # Combine
          # --------------------------------------------------

          if dfs:

              combined_df = pd.concat(
                  dfs,
                  ignore_index=True
              )

              print(
                  f'📊 Rows before deduplication: '
                  f'{len(combined_df)}'
              )

              # ------------------------------------------------
              # Remove duplicate Ad IDs
              # ------------------------------------------------

              if 'Ad ID' in combined_df.columns:

                  before = len(combined_df)

                  combined_df = combined_df.drop_duplicates(
                      subset=['Ad ID'],
                      keep='last'
                  )

                  removed = (
                      before
                      - len(combined_df)
                  )

                  print(
                      f'🔄 Removed '
                      f'{removed} duplicate Ad IDs'
                  )

              # ------------------------------------------------
              # Save FINAL CSV
              # ------------------------------------------------

              combined_df.to_csv(
                  'results.csv',
                  index=False
              )

              print(
                  f'✅ Final results.csv contains '
                  f'{len(combined_df)} records.'
              )

          else:

              print(
                  '⚠️ No CSV data found.'
              )

              # Create a clean empty CSV.
              pd.DataFrame(
                  columns=[
                      'Ad ID',
                      'Advertiser',
                      'Image'
                  ]
              ).to_csv(
                  'results.csv',
                  index=False
              )

              print(
                  '✅ Created empty results.csv.'
              )

          "

          echo ""
          echo "=============================================="
          echo "📸 FINAL IMAGE COUNT"
          echo "=============================================="

          if [ -d data ]; then

            find data -type f | sort

            echo ""
            echo "Total images:"
            find data -type f | wc -l

          else

            echo "No data directory."

          fi

          echo ""
          echo "=============================================="
          echo "📊 FINAL CSV"
          echo "=============================================="

          if [ -f results.csv ]; then

            echo "Rows:"
            wc -l results.csv

            echo ""
            echo "First 20 rows:"
            head -20 results.csv

          else

            echo "❌ results.csv does not exist."

          fi


      # ------------------------------------------------------
      # VERIFY FINAL STATE
      # ------------------------------------------------------

      - name: Verify Final Output
        run: |

          echo "=============================================="
          echo "🔎 FINAL OUTPUT VERIFICATION"
          echo "=============================================="

          echo ""
          echo "Repository data directory:"
          du -sh data 2>/dev/null || true

          echo ""
          echo "Number of image files:"
          find data -type f 2>/dev/null | wc -l

          echo ""
          echo "Number of CSV rows:"
          if [ -f results.csv ]; then
            wc -l < results.csv
          else
            echo "0"
          fi

          echo ""
          echo "URLs containing cache version:"
          if [ -f results.csv ]; then
            grep -o '?v=[^,]*' results.csv | sort | uniq -c | head -20 || true
          fi

          echo ""
          echo "Checking for duplicate Ad IDs:"
          if [ -f results.csv ]; then

            python -c "
          import pandas as pd

          df = pd.read_csv('results.csv')

          if 'Ad ID' in df.columns:

              duplicates = df[
                  df['Ad ID'].duplicated(keep=False)
              ]

              if len(duplicates) > 0:

                  print(
                      '⚠️ Duplicate Ad IDs found:'
                  )

                  print(
                      duplicates.to_string(
                          index=False
                      )
                  )

                  raise SystemExit(1)

              else:

                  print(
                      '✅ No duplicate Ad IDs.'
                  )
          "
          fi


      # ------------------------------------------------------
      # COMMIT
      # ------------------------------------------------------

      - name: Commit and Push

        run: |

          git config --global user.name "Ad-Processor-Bot"
          git config --global user.email "actions@github.com"

          echo "=============================================="
          echo "🔍 GIT STATUS"
          echo "=============================================="

          git status --short

          echo ""
          echo "=============================================="
          echo "📦 STAGING"
          echo "=============================================="

          # -A is intentional.
          #
          # Because data/ was completely rebuilt,
          # deleted old images will also be detected
          # and removed from the repository.

          git add -A data/ results.csv

          echo ""
          echo "=============================================="
          echo "📋 STAGED CHANGES"
          echo "=============================================="

          git diff --cached --stat

          echo ""
          echo "=============================================="
          echo "🚀 COMMIT"
          echo "=============================================="

          if git diff --cached --quiet; then

            echo "ℹ️ No changes detected."

          else

            git commit \
              -m "Sync: Combined Ad Images & Results CSV $(date +'%Y-%m-%d')"

            git push

            echo "✅ Changes pushed successfully."

          fi
