name: Process Ad Links High Speed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape Shard ${{ matrix.shard }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]  # 6 Parallel Workers

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install playwright pandas numpy aiohttp
          playwright install --with-deps chromium

      - name: Run Scraper Shard
        env:
          TOTAL_SHARDS: 6                  # Matches Python env key and matrix length
          SHARD_INDEX: ${{ matrix.shard }} # Passes 0, 1, 2, 3, 4, 5
          PYTHONUNBUFFERED: "1"
        run: python process_links.py

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ads-data-${{ matrix.shard }}
          path: |
            data/
            results.csv
          retention-days: 1

  commit_results:
    name: Merge and Push to Repo
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp_artifacts/
          pattern: ads-data-*

      - name: Merge Folders and Combine CSVs
        run: |
          pip install pandas
          mkdir -p data
          
          # Move images into data folder
          find temp_artifacts/ -type d -name "data" -exec cp -rn {}/. data/ \; 2>/dev/null || true

          # Python script to combine CSV fragments from all shards
          python -c "
          import os, glob, pandas as pd

          csv_files = glob.glob('temp_artifacts/**/results.csv', recursive=True)
          if csv_files:
              dfs = [pd.read_csv(f) for f in csv_files if os.path.getsize(f) > 0]
              if dfs:
                  combined_df = pd.concat(dfs, ignore_index=True).drop_duplicates(subset=['Ad ID'])
                  combined_df.to_csv('results.csv', index=False)
                  print(f'✅ Combined {len(combined_df)} total records into results.csv')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Processor-Bot"
          git config --global user.email "actions@github.com"
          
          git add data/ results.csv
          if [ -n "$(git status --porcelain data/ results.csv)" ]; then
            git commit -m "Sync: Combined Ad Images & Results CSV $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new images or result rows found."
          fi
