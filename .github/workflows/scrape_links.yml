name: Process Ad Links High Speed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================================
  # SCRAPE
  # ==========================================================

  scrape:
    name: Scrape Shard ${{ matrix.shard }}

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false

      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install Dependencies
        run: |
          pip install playwright pandas numpy aiohttp
          playwright install --with-deps chromium

      # ------------------------------------------------------
      # RUN SCRAPER
      # ------------------------------------------------------

      - name: Run Scraper Shard
        env:
          TOTAL_SHARDS: 6
          SHARD_INDEX: ${{ matrix.shard }}
          RUN_VERSION: ${{ github.run_id }}
          PYTHONUNBUFFERED: "1"

        run: |
          echo "=============================================="
          echo "🚀 STARTING SCRAPER"
          echo "=============================================="
          echo "Shard:        ${{ matrix.shard }}"
          echo "Total shards: 6"
          echo "Run ID:       ${{ github.run_id }}"
          echo "=============================================="

          python process_links.py

      # ------------------------------------------------------
      # SHOW SHARD RESULTS
      # ------------------------------------------------------

      - name: Show Shard Results
        if: always()
        run: |

          echo "=============================================="
          echo "📊 SHARD RESULTS"
          echo "=============================================="

          echo ""
          echo "🖼️ Images:"

          if [ -d "data" ]; then

            find data -type f | sort | head -100

            echo ""
            echo "Total images:"
            find data -type f | wc -l

            echo ""
            echo "Total image size:"
            du -sh data

          else

            echo "No data directory."

          fi

          echo ""
          echo "📊 CSV:"

          if [ -f "results.csv" ]; then

            echo "File size:"
            du -h results.csv

            echo ""
            echo "Lines:"
            wc -l results.csv

            echo ""
            echo "First 10 rows:"
            head -10 results.csv

          else

            echo "No results.csv found."

          fi

      # ------------------------------------------------------
      # UPLOAD SHARD ARTIFACTS
      # ------------------------------------------------------

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: ads-data-${{ matrix.shard }}

          path: |
            data/
            results.csv

          retention-days: 1


  # ==========================================================
  # MERGE
  # ==========================================================

  commit_results:

    name: Merge and Push to Repo

    needs: scrape

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.10'

      # ------------------------------------------------------
      # DOWNLOAD ALL SHARD ARTIFACTS
      # ------------------------------------------------------

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

        with:
          path: temp_artifacts/
          pattern: ads-data-*


      # ======================================================
      # MERGE CURRENT RUN
      # ======================================================

      - name: Merge Folders and Combine CSVs

        run: |

          pip install pandas

          echo "=============================================="
          echo "📦 DOWNLOADED ARTIFACTS"
          echo "=============================================="

          find temp_artifacts -type f | sort | head -200

          echo ""
          echo "=============================================="
          echo "📊 ARTIFACT CSV FILES"
          echo "=============================================="

          find temp_artifacts \
            -name "results.csv" \
            -type f \
            -print


          # ==================================================
          # REMOVE OLD REPOSITORY DATA
          # ==================================================

          echo ""
          echo "=============================================="
          echo "🧹 CLEANING OLD REPOSITORY DATA"
          echo "=============================================="

          rm -rf data
          rm -f results.csv

          mkdir -p data

          echo "✅ Old data/ removed."
          echo "✅ Old results.csv removed."


          # ==================================================
          # RESTORE CURRENT RUN IMAGES
          # ==================================================

          echo ""
          echo "=============================================="
          echo "🖼️ RESTORING CURRENT RUN IMAGES"
          echo "=============================================="

          for shard_data in temp_artifacts/ads-data-*/data; do

            if [ -d "$shard_data" ]; then

              echo ""
              echo "Copying:"
              echo "  $shard_data"

              cp -rf "$shard_data"/. data/

            else

              echo ""
              echo "⚠️ No data folder found:"
              echo "  $shard_data"

            fi

          done


          # ==================================================
          # COMBINE CURRENT RUN CSV FILES
          # ==================================================

          echo ""
          echo "=============================================="
          echo "📊 COMBINING CURRENT RUN CSV FILES"
          echo "=============================================="

          python -c "

          import os
          import glob
          import pandas as pd

          # --------------------------------------------------
          # Find ONLY results.csv files from artifacts
          # --------------------------------------------------

          csv_files = glob.glob(
              'temp_artifacts/**/results.csv',
              recursive=True
          )

          print(
              f'Found {len(csv_files)} shard CSV files.'
          )

          for f in csv_files:

              try:

                  size = os.path.getsize(f)

              except:

                  size = 0

              print(
                  f'  - {f} ({size} bytes)'
              )


          # --------------------------------------------------
          # Load shard CSVs
          # --------------------------------------------------

          dfs = []

          for f in csv_files:

              if not os.path.exists(f):
                  continue

              if os.path.getsize(f) == 0:

                  print(
                      f'  ⚠️ Empty CSV: {f}'
                  )

                  continue

              try:

                  df = pd.read_csv(f)

                  if df.empty:

                      print(
                          f'  ⚠️ No rows in: {f}'
                      )

                  else:

                      dfs.append(df)

                      print(
                          f'  ✅ Loaded '
                          f'{len(df)} rows from {f}'
                      )

              except Exception as e:

                  print(
                      f'  ❌ Failed to read '
                      f'{f}: {e}'
                  )


          # --------------------------------------------------
          # Combine
          # --------------------------------------------------

          if dfs:

              combined_df = pd.concat(
                  dfs,
                  ignore_index=True
              )

              print(
                  f'📊 Rows before deduplication: '
                  f'{len(combined_df)}'
              )


              # ------------------------------------------------
              # Remove duplicate Ad IDs
              # ------------------------------------------------

              if 'Ad ID' in combined_df.columns:

                  before = len(combined_df)

                  combined_df = combined_df.drop_duplicates(
                      subset=['Ad ID'],
                      keep='last'
                  )

                  removed = (
                      before
                      - len(combined_df)
                  )

                  print(
                      f'🔄 Removed '
                      f'{removed} duplicate Ad IDs'
                  )


              # ------------------------------------------------
              # Remove completely empty rows
              # ------------------------------------------------

              combined_df = combined_df.dropna(
                  how='all'
              )


              # ------------------------------------------------
              # Save FINAL CSV
              # ------------------------------------------------

              combined_df.to_csv(
                  'results.csv',
                  index=False
              )

              print(
                  f'✅ Final results.csv contains '
                  f'{len(combined_df)} records.'
              )

          else:

              print(
                  '⚠️ No CSV data found.'
              )

              pd.DataFrame(
                  columns=[
                      'Ad ID',
                      'Advertiser',
                      'Image'
                  ]
              ).to_csv(
                  'results.csv',
                  index=False
              )

              print(
                  '✅ Created empty results.csv.'
              )

          "


          # ==================================================
          # FINAL IMAGE COUNT
          # ==================================================

          echo ""
          echo "=============================================="
          echo "📸 FINAL IMAGE COUNT"
          echo "=============================================="

          if [ -d "data" ]; then

            echo ""
            echo "Image files:"
            find data -type f | sort

            echo ""
            echo "Total image files:"
            find data -type f | wc -l

            echo ""
            echo "Total data folder size:"
            du -sh data

          else

            echo "No data directory."

          fi


          # ==================================================
          # FINAL CSV
          # ==================================================

          echo ""
          echo "=============================================="
          echo "📊 FINAL CSV"
          echo "=============================================="

          if [ -f "results.csv" ]; then

            echo ""
            echo "CSV size:"
            du -h results.csv

            echo ""
            echo "CSV lines:"
            wc -l results.csv

            echo ""
            echo "First 20 rows:"
            head -20 results.csv

          else

            echo "❌ results.csv does not exist."

          fi


      # ======================================================
      # VERIFY FINAL OUTPUT
      # ======================================================

      - name: Verify Final Output

        run: |

          echo "=============================================="
          echo "🔎 FINAL OUTPUT VERIFICATION"
          echo "=============================================="

          echo ""
          echo "=============================================="
          echo "📁 DATA DIRECTORY"
          echo "=============================================="

          if [ -d "data" ]; then

            echo "Total size:"
            du -sh data

            echo ""
            echo "Detailed size:"
            du -sh data/* 2>/dev/null | sort -h

            echo ""
            echo "Number of files:"
            find data -type f | wc -l

          else

            echo "data/ does not exist."

          fi


          echo ""
          echo "=============================================="
          echo "🖼️ IMAGE TYPES"
          echo "=============================================="

          if [ -d "data" ]; then

            find data -type f \
              -printf "%f\n" \
              | sed 's/.*\.//' \
              | sort \
              | uniq -c

          fi


          echo ""
          echo "=============================================="
          echo "📊 RESULTS CSV"
          echo "=============================================="

          if [ -f "results.csv" ]; then

            echo "Size:"
            du -h results.csv

            echo ""
            echo "Lines:"
            wc -l results.csv

            echo ""
            echo "Data rows:"
            python -c "
          import pandas as pd

          df = pd.read_csv('results.csv')

          print(len(df))
          "

          else

            echo "results.csv does not exist."

          fi


          # ==================================================
          # CACHE VERSION CHECK
          # ==================================================

          echo ""
          echo "=============================================="
          echo "🔄 CACHE VERSION CHECK"
          echo "=============================================="

          if [ -f "results.csv" ]; then

            grep -o '?v=[^,]*' results.csv \
              | sort \
              | uniq -c \
              | head -20 || true

          fi


          # ==================================================
          # DUPLICATE AD ID CHECK
          # ==================================================

          echo ""
          echo "=============================================="
          echo "🔍 DUPLICATE AD ID CHECK"
          echo "=============================================="

          if [ -f "results.csv" ]; then

            python -c "

          import pandas as pd

          df = pd.read_csv(
              'results.csv'
          )

          if 'Ad ID' in df.columns:

              duplicates = df[
                  df['Ad ID'].duplicated(
                      keep=False
                  )
              ]

              if len(duplicates) > 0:

                  print(
                      '⚠️ Duplicate Ad IDs found:'
                  )

                  print(
                      duplicates.to_string(
                          index=False
                      )
                  )

                  raise SystemExit(1)

              else:

                  print(
                      '✅ No duplicate Ad IDs.'
                  )

          else:

              print(
                  '⚠️ Ad ID column not found.'
              )

          "

          fi


          # ==================================================
          # IMAGE / CSV CONSISTENCY CHECK
          # ==================================================

          echo ""
          echo "=============================================="
          echo "🔗 IMAGE / CSV CONSISTENCY CHECK"
          echo "=============================================="

          python -c "

          import os
          import pandas as pd
          import re

          if not os.path.exists('results.csv'):

              print(
                  '⚠️ results.csv missing.'
              )

              raise SystemExit(0)

          df = pd.read_csv(
              'results.csv'
          )

          missing = []

          for _, row in df.iterrows():

              ad_id = str(
                  row.get(
                      'Ad ID',
                      ''
                  )
              ).strip()

              advertiser = str(
                  row.get(
                      'Advertiser',
                      ''
                  )
              ).strip()

              if not ad_id or not advertiser:
                  continue

              safe_advertiser = re.sub(
                  r'[<>:\"/\\\\|?*]',
                  '',
                  advertiser
              ).strip()

              expected = os.path.join(
                  'data',
                  safe_advertiser,
                  f'{ad_id}.jpg'
              )

              if not os.path.exists(expected):

                  missing.append(
                      expected
                  )

          print(
              f'CSV rows checked: {len(df)}'
          )

          print(
              f'Missing images: {len(missing)}'
          )

          if missing:

              print(
                  'First missing images:'
              )

              for item in missing[:20]:

                  print(
                      f'  ❌ {item}'
                  )

          else:

              print(
                  '✅ Every CSV row has a corresponding image.'
              )

          "


      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit and Push

        run: |

          git config --global user.name "Ad-Processor-Bot"
          git config --global user.email "actions@github.com"


          echo "=============================================="
          echo "🔍 GIT STATUS"
          echo "=============================================="

          git status --short


          echo ""
          echo "=============================================="
          echo "📦 STAGING"
          echo "=============================================="

          git add -A data/ results.csv


          echo ""
          echo "=============================================="
          echo "📋 STAGED CHANGES"
          echo "=============================================="

          git diff --cached --stat


          echo ""
          echo "=============================================="
          echo "🚀 COMMIT"
          echo "=============================================="

          if git diff --cached --quiet; then

            echo "ℹ️ No changes detected."

          else

            git commit \
              -m "Sync: Combined Ad Images & Results CSV $(date +'%Y-%m-%d')"

            git push

            echo "✅ Changes pushed successfully."

          fi
