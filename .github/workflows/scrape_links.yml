name: Process Ad Links High Speed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape Shard ${{ matrix.shard }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]  # 6 Parallel Workers

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install playwright pandas numpy aiohttp
          playwright install --with-deps chromium

      - name: Run Scraper Shard
        env:
          TOTAL_SHARDS: 6                  # Matches Python env key and matrix length
          SHARD_INDEX: ${{ matrix.shard }} # Passes 0, 1, 2, 3, 4, 5
          PYTHONUNBUFFERED: "1"
        run: python process_links.py

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ads-data-${{ matrix.shard }}
          path: |
            data/
            results.csv
          retention-days: 1

  commit_results:
    name: Merge and Push to Repo
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp_artifacts/
          pattern: ads-data-*

      - name: Merge Folders and Combine CSVs
        run: |
          pip install pandas

          echo "📦 Contents of downloaded artifacts:"
          find temp_artifacts -type f | head -50

          mkdir -p data

          echo "🖼️ Restoring images from artifacts..."

          # Copy every shard's data folder into the repository data folder.
          # -r = recursive
          # -f = overwrite existing files
          for shard_data in temp_artifacts/ads-data-*/data; do
            if [ -d "$shard_data" ]; then
              echo "Copying: $shard_data"
              cp -rf "$shard_data"/. data/
            fi
          done

          echo "📊 Combining CSV files..."

          python -c "
          import os
          import glob
          import pandas as pd

          csv_files = glob.glob(
              'temp_artifacts/**/results.csv',
              recursive=True
          )

          print(f'Found {len(csv_files)} CSV files:')

          for f in csv_files:
              print(f'  - {f} ({os.path.getsize(f)} bytes)')

          dfs = []

          for f in csv_files:
              if os.path.exists(f) and os.path.getsize(f) > 0:
                  try:
                      df = pd.read_csv(f)

                      if not df.empty:
                          dfs.append(df)
                          print(f'  ✅ Loaded {len(df)} rows from {f}')
                      else:
                          print(f'  ⚠️ Empty CSV: {f}')

                  except Exception as e:
                      print(f'  ❌ Failed to read {f}: {e}')

          if dfs:
              combined_df = pd.concat(
                  dfs,
                  ignore_index=True
              )

              # Remove duplicate Ad IDs
              if 'Ad ID' in combined_df.columns:
                  before = len(combined_df)

                  combined_df = combined_df.drop_duplicates(
                      subset=['Ad ID'],
                      keep='last'
                  )

                  print(
                      f'🔄 Removed {before - len(combined_df)} duplicate Ad IDs'
                  )

              combined_df.to_csv(
                  'results.csv',
                  index=False
              )

              print(
                  f'✅ Combined {len(combined_df)} total records into results.csv'
              )

          else:
              print('⚠️ No CSV data found.')
          "

          echo "📸 Images currently in repository data folder:"
          find data -type f | wc -l

          echo "📊 Results CSV:"
          if [ -f results.csv ]; then
            wc -l results.csv
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Processor-Bot"
          git config --global user.email "actions@github.com"

          echo "🔍 Checking changes..."

          git status --short

          git add -A data/ results.csv

          echo "📋 Staged changes:"
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No new images or result rows found."
          else
            git commit -m "Sync: Combined Ad Images & Results CSV $(date +'%Y-%m-%d')"
            git push
          fi
