name: Process Ad Links High Speed
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install playwright pandas httpx
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          PYTHONUNBUFFERED: "1"
          # CHANGE TO "false" AFTER YOUR FIRST RUN
          PURGE_DATA: "true" 
        run: python process_links.py

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Processor-Bot"
          git config --global user.email "actions@github.com"
          git add data/
          if [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "Sync: New Ad Images/Screenshots $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new images."
          fi
