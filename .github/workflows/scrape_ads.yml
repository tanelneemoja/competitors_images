name: Scrape Competitor Ads
on:
  push:
    branches:
      - main  # Triggers whenever you push code to the main branch
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:   # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          PYTHONUNBUFFERED: "1"  # This forces logs to show up in real-time
        run: python your_script_name.py

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Scraper-Bot"
          git config --global user.email "actions@github.com"
          
          # Add all changes (new files, modified files, AND deleted files)
          git add -A data/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Organized batch sync: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes in ad library."
          fi
