name: Scrape Competitor Ads
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache OCR Models
        uses: actions/cache@v3
        with:
          path: ~/.EasyOCR
          key: ${{ runner.os }}-easyocr-models

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests easyocr numpy opencv-python-headless
          playwright install --with-deps chromium

      - name: Run Unified Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: python scrape_script.py

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Scraper-Bot"
          git config --global user.email "actions@github.com"
          git add data/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Sync: Rimi & Selver Ads $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new ads found today."
          fi
