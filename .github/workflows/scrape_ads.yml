name: Scrape Competitor Ads
on:
  push:
    branches:
      - main  # Triggers whenever you push code to the main branch
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:   # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scrape_script.py

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Scraper-Bot"
          git config --global user.email "actions@github.com"
          
          mkdir -p data
          
          # This looks for any file starting with CR
          if ls data/CR*.png 1> /dev/null 2>&1; then
            git add data/CR*.png
            git commit -m "Added creative image for BigQuery matching"
            git push
          else
            echo "No CR-named images found."
          fi
            git push
          else
            echo "No image found to commit."
          fi
