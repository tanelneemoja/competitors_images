name: Scrape Competitor Ads
on:
  push:
    branches:
      - main  
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:   # Manual trigger button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Unified Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: python scrape_script.py

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Scraper-Bot"
          git config --global user.email "actions@github.com"
          
          # Add all new folders (data/Rimi and data/Selver)
          git add data/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Sync: Rimi & Selver Ads $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new ads found today."
          fi
