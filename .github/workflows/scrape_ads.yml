name: Scrape Competitor Ads
on:
  push:
    branches:
      - main  # Triggers whenever you push code to the main branch
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:   # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scrape_script.py

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Scraper-Bot"
          git config --global user.email "actions@github.com"
          
          # 1. Stage EVERYTHING in the data folder, including deletions
          git add -A data/
          
          # 2. Commit and push only if there's a difference
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Syncing ad library: $(date +'%Y-%m-%d')"
            git push
          else
            echo "GitHub is already perfectly synced with the scraper output."
          fi
