name: Scrape Competitor Ads
on:
  push:
    branches:
      - main  # Triggers whenever you push code to the main branch
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:   # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scrape_script.py

      - name: Commit and Push
        run: |
          git config --global user.name "Ad-Scraper-Bot"
          git config --global user.email "actions@github.com"
          
          # Ensure the directory exists so git add doesn't crash
          mkdir -p data
          
          # Only add and commit if there are actually files in data/
          if [ -n "$(ls -A data/ 2>/dev/null)" ]; then
            git add data/
            git commit -m "Auto-scraped new ad creative"
            git push
          else
            echo "No files found in data directory. Skipping commit."
          fi
